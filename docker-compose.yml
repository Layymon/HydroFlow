services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hydroflow
      POSTGRES_USER: hydroflow
      POSTGRES_PASSWORD: hydroflow_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydroflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://hydroflow:hydroflow_dev@db:5432/hydroflow
      FLOOD_HISTORY_PATH: /data/validated_daily.csv
      OPENTOPOGRAPHY_API_KEY: ${OPENTOPOGRAPHY_API_KEY:-}
    volumes:
      - ./data/processed/validated_daily.csv:/data/validated_daily.csv:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
